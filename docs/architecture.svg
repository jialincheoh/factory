<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-label="Two loops share one Postgres system of record. Online: real estate agent's app to API service to job queue to generation worker, which calls LLM serving and an optional reranker and writes shuffled drafts to Postgres; the real estate agent reads them, records a decision, and publishes the kept ad on our own property portal. Feedback: our own property portal logs views, clicks and inquiries into Postgres, and phone inquiries go to the CRM; a nightly export trains the reranker, which is redeployed. Phone inquiries are hard to link to a specific ad.">
  <title>Listing Ad Pipeline: system design</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
    <defs>
      <marker id="aOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
      <marker id="aFb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0620a"/></marker>
      <marker id="aRk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2362f"/></marker>
    </defs>

    <!-- lanes -->
    <rect x="8" y="34" width="1024" height="206" rx="6" fill="#eceff3"/>
    <text x="22" y="56" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b6573" letter-spacing="1">ONLINE · PER REQUEST · SECONDS</text>
    <rect x="8" y="408" width="1024" height="230" rx="6" fill="#eceff3"/>
    <text x="22" y="430" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b6573" letter-spacing="1">FEEDBACK · DAYS TO WEEKS</text>

    <!-- boxes: online -->
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#1b2129">
      <g><rect x="20" y="110" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="95" y="134" text-anchor="middle" font-size="13" font-weight="700">Real estate agent</text>
        <text x="95" y="152" text-anchor="middle" font-size="11" fill="#5b6573">web app: keeps, edits, rejects</text></g>
      <g><rect x="220" y="110" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="295" y="134" text-anchor="middle" font-size="13" font-weight="700">API service</text>
        <text x="295" y="152" text-anchor="middle" font-size="11" fill="#5b6573">assigns A/B arm + seed</text></g>
      <g><rect x="420" y="110" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="495" y="134" text-anchor="middle" font-size="13" font-weight="700">Job queue</text>
        <text x="495" y="152" text-anchor="middle" font-size="11" fill="#5b6573">async, retries</text></g>
      <g><rect x="620" y="110" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="695" y="134" text-anchor="middle" font-size="13" font-weight="700">Generation worker</text>
        <text x="695" y="152" text-anchor="middle" font-size="11" fill="#5b6573">builds prompt, shuffles</text></g>
      <g><rect x="870" y="66" width="160" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="950" y="90" text-anchor="middle" font-size="13" font-weight="700">LLM serving</text>
        <text x="950" y="108" text-anchor="middle" font-size="11" fill="#5b6573">vLLM or Gemini API</text></g>
      <g><rect x="870" y="164" width="160" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="950" y="188" text-anchor="middle" font-size="13" font-weight="700">Reranker</text>
        <text x="950" y="206" text-anchor="middle" font-size="11" fill="#5b6573">v0: none, random order</text></g>

      <!-- system of record -->
      <g><rect x="230" y="274" width="580" height="96" rx="5" fill="#f6f7f9" stroke="#1b2129" stroke-width="2"/>
        <text x="520" y="300" text-anchor="middle" font-size="14" font-weight="700">Postgres · system of record</text>
        <text x="520" y="322" text-anchor="middle" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#5b6573">real_estate_agents · listings · generation_requests · candidates</text>
        <text x="520" y="340" text-anchor="middle" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#5b6573">decisions · rankings · published_ads · ad_events · ad_daily_stats · outcomes</text>
        <text x="520" y="358" text-anchor="middle" font-size="11" fill="#5b6573">append-only events, no buyer contact details</text></g>

      <!-- boxes: feedback -->
      <g><rect x="20" y="470" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="95" y="494" text-anchor="middle" font-size="13" font-weight="700">Our property portal</text>
        <text x="95" y="512" text-anchor="middle" font-size="11" fill="#5b6573">views, clicks, inquiries</text></g>
      <g><rect x="20" y="568" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="95" y="592" text-anchor="middle" font-size="13" font-weight="700">CRM</text>
        <text x="95" y="610" text-anchor="middle" font-size="11" fill="#5b6573">buyer contacts stay here</text></g>
      <g><rect x="250" y="470" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="325" y="494" text-anchor="middle" font-size="13" font-weight="700">Event logger</text>
        <text x="325" y="512" text-anchor="middle" font-size="11" fill="#5b6573">first-hand, deduplicated</text></g>
      <g><rect x="620" y="470" width="150" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="695" y="494" text-anchor="middle" font-size="13" font-weight="700">Analytics export</text>
        <text x="695" y="512" text-anchor="middle" font-size="11" fill="#5b6573">nightly snapshot</text></g>
      <g><rect x="870" y="470" width="160" height="56" rx="5" fill="#f6f7f9" stroke="#1b2129"/>
        <text x="950" y="494" text-anchor="middle" font-size="13" font-weight="700">Train reranker</text>
        <text x="950" y="512" text-anchor="middle" font-size="11" fill="#5b6573">keeps + outcomes</text></g>
    </g>

    <!-- arrows: online -->
    <g fill="none" stroke="#1f5fbf" stroke-width="1.8">
      <line x1="170" y1="138" x2="218" y2="138" marker-end="url(#aOn)"/>
      <line x1="370" y1="138" x2="418" y2="138" marker-end="url(#aOn)"/>
      <line x1="570" y1="138" x2="618" y2="138" marker-end="url(#aOn)"/>
      <polyline points="770,128 810,128 810,94 868,94" marker-end="url(#aOn)"/>
      <polyline points="770,150 810,150 810,192 868,192" marker-end="url(#aOn)"/>
      <line x1="695" y1="166" x2="695" y2="272" marker-end="url(#aOn)"/>
      <line x1="320" y1="272" x2="320" y2="168" marker-start="url(#aOn)" marker-end="url(#aOn)"/>
      <line x1="95" y1="166" x2="95" y2="468" marker-end="url(#aOn)"/>
    </g>
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f5fbf">
      <text x="194" y="130" text-anchor="middle">request</text>
      <text x="394" y="130" text-anchor="middle">enqueue</text>
      <text x="594" y="130" text-anchor="middle">pull job</text>
      <text x="839" y="86" text-anchor="middle">prompt ×5</text>
      <text x="839" y="208" text-anchor="middle">score</text>
      <text x="703" y="236">write drafts + seed</text>
      <text x="328" y="236">read drafts, write decision</text>
      <text x="103" y="300">publish kept ad</text>
    </g>

    <!-- arrows: feedback -->
    <g fill="none" stroke="#a0620a" stroke-width="1.8">
      <line x1="170" y1="498" x2="248" y2="498" marker-end="url(#aFb)"/>
      <line x1="370" y1="470" x2="370" y2="372" marker-end="url(#aFb)"/>
      <line x1="695" y1="370" x2="695" y2="468" marker-end="url(#aFb)"/>
      <line x1="770" y1="498" x2="868" y2="498" marker-end="url(#aFb)"/>
      <line x1="950" y1="470" x2="950" y2="222" marker-end="url(#aFb)"/>
    </g>
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a0620a">
      <text x="209" y="490" text-anchor="middle">events</text>
      <text x="378" y="400">append, unique (source, event id)</text>
      <text x="703" y="400">nightly</text>
      <text x="819" y="490" text-anchor="middle">train</text>
      <text x="942" y="400" text-anchor="end">deploy new version</text>
    </g>

    <!-- uncertain link -->
    <polyline points="170,596 325,596 325,528" fill="none" stroke="#c2362f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aRk)"/>
    <text x="180" y="588" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c2362f">phone calls: which ad?</text>
  </svg>
