{% extends "base.html" %}
{% block title %}Agent sign-in · Homefinder{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Real estate agent sign-in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/agent/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
